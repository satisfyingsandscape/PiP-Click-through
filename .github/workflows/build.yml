name: Build and release portable Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64 portable package
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Prepare application icon
        shell: pwsh
        run: |
          $icon = [Convert]::FromBase64String((Get-Content .\assets\app-icon.b64 -Raw).Trim())
          [IO.File]::WriteAllBytes(".\PiPClickThrough\app.ico", $icon)

      - name: Publish self-contained executable
        shell: pwsh
        run: |
          dotnet publish .\PiPClickThrough\PiPClickThrough.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o .\publish

      - name: Add README to portable package
        shell: pwsh
        run: Copy-Item .\README.md .\publish\README.md

      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\dist | Out-Null
          Compress-Archive -Path .\publish\* -DestinationPath .\dist\PiPClickThrough-win-x64.zip -CompressionLevel Optimal

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiPClickThrough-win-x64
          path: .\dist\PiPClickThrough-win-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Determine release version
        if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')
        id: release_version
        uses: actions/github-script@v7
        with:
          script: |
            const message = context.payload.head_commit.message;
            const match = message.match(/^release:\\s*(v\\d+\\.\\d+\\.\\d+)/);
            if (!match) {
              core.setFailed('Release commit message must look like: release: v0.2.2');
              return;
            }
            core.setOutput('tag', match[1]);

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_version.outputs.tag }}
          target_commitish: main
          name: PiP Click-through ${{ steps.release_version.outputs.tag }}
          generate_release_notes: true
          files: .\\dist\\PiPClickThrough-win-x64.zip
          fail_on_unmatched_files: true
